apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoclose
  labels: { app: autoclose }
spec:
  replicas: 1            # keep at 1 until the checkpointer moves to PostgreSQL (see api.py note)
  selector:
    matchLabels: { app: autoclose }
  template:
    metadata:
      labels: { app: autoclose }
    spec:
      containers:
        - name: autoclose
          image: <ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/autoclose:latest   # replace
          ports: [{ containerPort: 8000 }]
          env:
            - { name: AUTOCLOSE_LLM, value: "stub" }       # set to "bedrock" with BEDROCK_MODEL_ID and AWS_REGION
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1",   memory: 1Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: autoclose
spec:
  selector: { app: autoclose }
  ports:
    - { port: 80, targetPort: 8000 }
